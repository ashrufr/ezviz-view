[package]
name = "ezviz-view"
version = "0.1.0"
edition = "2021"
description = "Multi-camera RTSP viewer for EZVIZ / Hikvision cameras on Linux"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
ffmpeg-next = "7"
sdl2 = "0.37"
ctrlc = { version = "3", features = ["termination"] }
ureq = { version = "2", features = ["tls"] }

[profile.release]
lto = true
strip = true
